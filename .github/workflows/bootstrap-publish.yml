name: bootstrap-publish

# TEMPORARY. Delete this file and the NPM_TOKEN secret the moment trusted
# publishing is configured — this workflow exists to make itself unnecessary.
#
# WHY IT HAS TO EXIST AT ALL. npm cannot attach a trusted publisher to a package
# that does not exist: there is no settings page for an unpublished name, so the
# FIRST publish of a new package cannot authenticate via OIDC (npm/cli#8544 —
# PyPI allows pre-configuring a publisher for a not-yet-existing project, npm
# does not). Every release after the first goes through publish.yml with no
# token at all.
#
# So this does that one publish from Actions rather than from someone's laptop,
# which is the same reason release-cut.yml exists: the bootstrap step is still a
# step, and it should be auditable rather than personal.
#
# The token is a granular access token with publish scope for this package only.
# Delete it after use. npm is retiring direct publish from 2FA-bypass tokens
# around January 2027, so this path has an expiry date by design.

on:
  workflow_dispatch:
    inputs:
      confirm-version:
        description: "Version to publish, e.g. 0.1.0. Must match package.json."
        type: string
        required: true
      otp:
        description: >-
          Current 6-digit 2FA code from your authenticator. Passed to npm as
          --otp, so the account's 2FA-on-writes stays ENFORCED — no bypass
          token. The code is single-use and expires in ~30s; the run reaches
          the publish step in ~11s (measured), so dispatch immediately after
          reading it. Leave empty only if the token bypasses 2FA.
        type: string
        required: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance is signed via OIDC even though AUTH is the token
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Node 24, not 22: trusted publishing needs npm >= 11.5.1, and Node 22
          # ships npm 10.9.8 — proven by a real run, which the floor assert below
          # refused before it could reach npm. npm's docs say "Node >= 22.14.0",
          # which is necessary but NOT sufficient; the npm floor is what binds.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # npm recommends never caching in release builds.
          package-manager-cache: false

      # SELF-OBSOLETING. Once the package exists, trusted publishing can be
      # configured and this workflow has no reason to run again — so it refuses
      # rather than quietly becoming a second, token-shaped way to publish.
      - name: Refuse if the package already exists
        run: |
          set -euo pipefail
          name=$(jq -r .name package.json)
          if npm view "$name" version >/dev/null 2>&1; then
            echo "::error::$name is already on npm. This workflow is for the FIRST publish only —" \
                 "configure trusted publishing and delete this file and the NPM_TOKEN secret."
            exit 1
          fi
          echo "$name is not on npm yet — bootstrap applies"

      - name: The version you typed must match package.json
        env:
          CONFIRM: ${{ inputs.confirm-version }}
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          echo "package.json=$pkg confirm=$CONFIRM"
          if [ "$pkg" != "$CONFIRM" ]; then
            echo "::error::package.json is $pkg, you typed $CONFIRM. Refusing."
            exit 1
          fi

      - name: Publish (token auth, OIDC provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OTP: ${{ inputs.otp }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set. Add it as a repository secret — a granular" \
                 "access token with read+write on the OWNING SCOPE (the package does not" \
                 "exist yet, so it cannot be selected by name), and delete it afterwards."
            exit 1
          fi
          # 2FA-on-writes surfaces here as EOTP: npm cannot prompt in CI. The
          # dispatch-time --otp is the fix that keeps 2FA enforced; a Bypass-2FA
          # token is the fallback npm itself is deprecating.
          if [ -n "${OTP:-}" ]; then
            npm publish --access public --provenance --otp "$OTP"
          else
            npm publish --access public --provenance
          fi

      - name: What to do now
        run: |
          echo "::notice::Published. Now: (1) configure the trusted publisher on npmjs.com" \
               "— bdelanghe / brand / release.yml / environment npm-publish (mint#48: npm validates" \
               "the ENTRY workflow's filename, and a package gets exactly one publisher);" \
               "(2) delete the NPM_TOKEN secret; (3) delete .github/workflows/bootstrap-publish.yml." \
               "Releases after this are OIDC-only, through release.yml."
