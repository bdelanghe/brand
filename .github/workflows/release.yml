name: release

# THE SINGLE RELEASE ENTRY POINT for @bdelanghe/brand.
#
# ############################################################################
# # WHY ONE FILE, AND WHY THIS FILENAME.                                     #
# ############################################################################
#
# npm's trusted publishing validates the ENTRY workflow's filename, not the file
# that contains `npm publish`, and a package may have exactly ONE trusted
# publisher configured. This repo had three registerable entry points —
# `cut.yml` (dispatch) and `publish.yml` (tag push AND dispatch) — so npm would
# validate a different name depending on how the release started, and only one of
# them could ever be configured. mint#48 prescribes `release.yml` org-wide; see
# bounded-systems/mint → docs/npm-trusted-publishing.md.
#
#   npm form:  bdelanghe / brand / release.yml / npm-publish
#
# There are NO exceptions: nothing else in this repo may run `npm publish` or
# call the lane, and test/workflows.test.mjs asserts that unconditionally. The
# `bootstrap-publish.yml` that once carved one out — token-authenticated,
# because npm cannot attach a trusted publisher to a package that does not yet
# exist (npm/cli#8544) — did its one job for brand@0.1.0 and is deleted.
#
# ############################################################################
# # THREE DOORS, ONE TAG.                                                    #
# ############################################################################
#
#   workflow_dispatch (expect-version, dry-run)  the release. `cut` calls mint's
#       release-cut to create the tag in CI, and everything below chains off it.
#   workflow_dispatch (recover-tag)              RECOVERY for a half-shipped
#       release: skips the cut and the provenance (both already landed) and
#       re-runs the npm publish against an existing tag.
#   push: tags ["v*"]                            a tag cut from a checkout by
#       `mint release`.
#
# A TAG PUSHED BY CI TRIGGERS NOTHING. GitHub creates no workflow runs from
# events caused by GITHUB_TOKEN, so the `push: tags` trigger will NOT fire for
# the tag `cut` pushes — every job depends on `cut` rather than waiting to be
# triggered by it. `resolve` joins all three doors into one tag, and every
# checkout names it; without that pin a dispatched run publishes MAIN under a
# version tag's name.
#
# DRY RUN DEFAULTS TO TRUE. An npm publish is irreversible, so verifying is the
# default and releasing is the explicit act.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      expect-version:
        description: "Version you expect to cut (e.g. 0.1.0). Fails if package.json disagrees."
        type: string
        required: false
      dry-run:
        description: "Verify only — run every guard and cut nothing."
        type: boolean
        default: true
      recover-tag:
        description: "RECOVERY: re-publish this existing tag (e.g. v0.1.0). Skips the cut and the provenance."
        type: string
        required: false

permissions:
  contents: read

jobs:
  cut:
    if: github.event_name == 'workflow_dispatch' && inputs.recover-tag == ''
    permissions:
      contents: write # create + push the tag
    uses: bounded-systems/mint/.github/workflows/release-cut.yml@66e3b42693355c9e7be82b319fb6eb8a838d0bce # mint main @ mint#49
    with:
      ref: 66e3b42693355c9e7be82b319fb6eb8a838d0bce
      expect-version: ${{ inputs.expect-version }}
      dry-run: ${{ inputs.dry-run }}

  # ONE tag for all three doors. `!cancelled()` rather than `always()`: `cut` is
  # SKIPPED on the push and recovery paths and a plain `needs:` would skip this
  # with it — but a cancelled run must still stop here. The condition is also the
  # dry-run gate: `cut` reports `cut: 'false'` for a dry run and nothing at all
  # when it failed, so both leave every job below skipped.
  resolve:
    needs: [cut]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.recover-tag != '' || needs.cut.outputs.cut == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          RECOVER: ${{ inputs.recover-tag }}
          CUT_TAG: ${{ needs.cut.outputs.tag }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # On a dispatch, $REF is the BRANCH. The v-shape check is what stops a
          # branch name reaching a job that would publish under it.
          tag="${RECOVER:-${CUT_TAG:-$REF}}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::'$tag' is not a v<version> tag — refusing to release a branch"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

  verify:
    needs: resolve
    # A STATUS FUNCTION IS MANDATORY ON EVERY JOB DOWNSTREAM OF `cut`.
    #
    # GitHub propagates a skip through the entire `needs` CLOSURE, not one hop:
    # `cut` is SKIPPED on the tag-push and recovery doors, and every job that
    # transitively needs it is skipped too — unless that job ITSELF calls a
    # status function. `resolve`'s `!cancelled()` clears the taint for `resolve`
    # and nothing else, and a plain condition clears it not at all.
    #
    # Shipped broken: site-mcp's v0.3.0 recovery resolved the tag, skipped every
    # job beneath it and reported SUCCESS having published nothing. A dry run
    # cannot tell that apart from correct behaviour, because a dry run skips
    # those same jobs on purpose.
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      # tokens.css is GENERATED from tokens.json. Publishing a tarball whose
      # generated CSS does not match its source would ship tokens that no longer
      # describe the palette they claim to. mint's lane checks the tag against
      # package.json; this is the check only this repo can make.
      - name: tokens.css is in sync with tokens.json
        run: node tokens/build-tokens.mjs --check

  # The signed in-toto release Statement, attached to the GitHub release. Skipped
  # on the recovery path: that tag's release already exists, and a published
  # GitHub release is immutable — re-running this would go red for work that had
  # in fact succeeded (mint#19).
  provenance:
    needs: [resolve, verify]
    # Status function mandatory — see the `verify` job. A plain condition
    # like this one alone does NOT clear the skip taint from `cut`.
    if: ${{ !cancelled() && needs.verify.result == 'success' && inputs.recover-tag == '' }}
    permissions:
      contents: write # create / upload to the GitHub release
      id-token: write # OIDC — cosign keyless signing
      # Not optional. GitHub validates a called workflow's permission requests as
      # the UNION of its permissions block AT LOAD TIME, before any `if:`.
      # release-provenance.yml asks for actions: read, so withholding it fails the
      # whole run with a startup_failure and no job ever starts.
      actions: read
    uses: bounded-systems/mint/.github/workflows/release-provenance.yml@66e3b42693355c9e7be82b319fb6eb8a838d0bce # mint main @ mint#49
    with:
      ref: 66e3b42693355c9e7be82b319fb6eb8a838d0bce
      tag: ${{ needs.resolve.outputs.tag }}

  # npm via mint's reusable lane (mint#48). It owns the npm >= 11.5.1 / node >=
  # 22.14.0 floors — ASSERTED, never installed, because `npm install -g npm@latest`
  # in a release path is how npm v12 arrived unannounced and killed a site-mcp
  # publish — plus package-manager-cache: false, the tag-pinned checkout, the
  # idempotence probe and --provenance over OIDC.
  #
  # The `npm-publish` environment is the claim npm's trusted-publisher Environment
  # field pins; add a required reviewer to it to gate releases on approval.
  npm:
    needs: [resolve, verify]
    # Status function mandatory — see the `verify` job.
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for publish auth
    uses: bounded-systems/mint/.github/workflows/npm-publish.yml@66e3b42693355c9e7be82b319fb6eb8a838d0bce # mint main @ mint#49
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      environment: npm-publish
      # brand has zero dependencies and no lockfile, so the lane's default
      # `npm ci` would fail with nothing to do. There is nothing to install.
      install: echo "no dependencies and no lockfile — nothing to install"
